name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build self-contained jar
        run: ./gradlew shadowJar --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jadxsrv-jar
          path: build/libs/jadxsrv-all.jar
